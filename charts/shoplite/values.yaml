# ShopLite chart — parameter schema, layer 1 of 3 (chart defaults).
#
# Values are merged in this order; a later layer overrides an earlier one key by key
# (maps merge deeply, lists and scalars are replaced):
#   1. charts/shoplite/values.yaml           this file: safe baseline shared by every environment
#   2. environments/<env>/values.yaml        what differs per environment (replicas, host, sizing…)
#   3. ApplicationSet helm.parameters        only global.environment, injected from the generator,
#                                            so the environment name and the namespace cannot diverge
# The contract is enforced by values.schema.json: helm lint / helm template / Argo CD reject
# unknown keys and out-of-range values before anything reaches the API server.

global:
  # dev | staging | prod. Required; set by the ApplicationSet (layer 3).
  environment: ""

# Applied to every application image unless a service overrides it.
image:
  # Empty → local images loaded into kind (shoplite/<service>:<tag>).
  # For a real registry: ghcr.io/timurdll/devops-labs (pushed and signed by the Week 6 pipeline).
  registry: ""
  # Empty → Chart.appVersion. Promotion between environments = changing this value in git.
  tag: ""
  pullPolicy: IfNotPresent

# North-south entry point (Traefik, Week 7). One host per environment.
ingress:
  enabled: true
  className: traefik
  host: shop.local

# Pod-level defaults shared by all stateless services (Week 7 hardening, unchanged).
podDefaults:
  terminationGracePeriodSeconds: 30
  # Seconds the pod keeps serving after it is removed from the endpoints (rolling-update drain).
  preStopSleepSeconds: 5
  revisionHistoryLimit: 3
  # Hard spread of the replicas of one revision across worker nodes.
  topologySpread:
    enabled: true
    whenUnsatisfiable: DoNotSchedule

# PodDisruptionBudget (minAvailable: 1) for every service with replicas > 1.
podDisruptionBudget:
  enabled: false

# Week 9 — observability. When enabled, every service with `instrumented: true`:
#   • gets OTEL_* variables → spans are exported over OTLP/HTTP to the OpenTelemetry Collector
#   • gets prometheus.io/* pod annotations → the Collector scrapes GET /metrics (RED histograms)
#   • accepts scrapes from the Collector pods on :8080 (NetworkPolicy allow-telemetry-scrape)
telemetry:
  enabled: false
  # OTLP/HTTP base URL of the Collector; the SDK appends /v1/traces.
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  # Head sampling: parentbased_traceidratio. The decision travels in traceparent (flags 01/00),
  # so one sampled request is sampled in every downstream service.
  samplingRatio: 1.0
  # Where the Collector runs (source of scrapes).
  collector:
    namespace: observability
    podName: otel-collector

# Week 10 — Istio service mesh (sidecar mode). Needs the control plane of gitops/apps/mesh.yaml.
# When enabled, every pod gets an Envoy sidecar and a ServiceAccount of its own (its SPIFFE
# identity), north-south traffic enters through a per-environment Envoy gateway (Traefik → gateway)
# and the chart renders Gateway, VirtualService, DestinationRule, PeerAuthentication and
# AuthorizationPolicy objects (templates/mesh.yaml).
mesh:
  enabled: false
  # mTLS mode of the namespace's sidecars (PeerAuthentication):
  #   PERMISSIVE  mTLS and plaintext — only while workloads are being moved into the mesh
  #   STRICT      mTLS only; the mesh-wide default (k8s/mesh/peer-authentication.yaml)
  mtlsMode: STRICT
  # Identity-based authorization: default deny + one ALLOW per edge of the call graph
  # (gateway → exposed services, services.<name>.allowFrom, database clients → postgres).
  authorization: true
  gateway:
    replicas: 1
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: "1", memory: 256Mi }
  # Client-side policy applied by every caller's sidecar (DestinationRule per service).
  trafficPolicy:
    connectTimeout: 1s
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

# Stateless services. The key is the Kubernetes name (Deployment, Service, DNS name).
services:
  catalog:
    enabled: true
    component: api
    tier: backend
    replicas: 2
    image:
      repository: shoplite/catalog
      tag: "" # empty → image.tag → Chart.appVersion
    runAsUser: 65532 # distroless "nonroot"
    # Exposes /metrics and emits OpenTelemetry spans (see telemetry).
    instrumented: true
    probes:
      readinessPath: /readyz
      livenessPath: /healthz
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    # Exposed through the Ingress under this path prefix ("" → not exposed).
    ingressPath: /api/catalog
    # Gets its own database + login role; the password is read from database.existingSecret.
    database:
      name: catalog
      passwordKey: CATALOG_DB_PASSWORD
    # Extra non-secret settings → <service>-config ConfigMap → envFrom.
    env: {}
    # Other services allowed to call this one (NetworkPolicy + AuthorizationPolicy in the mesh).
    allowFrom: [orders]
    # Week 10: canary release through the mesh. A second Deployment <name>-<version> with
    # canary.image.tag runs next to the stable one (pod label version: v1); the VirtualServices
    # send canary.weight % of all requests to it — at the gateway and between services.
    # Promotion = raising the weight in git; rollback = weight 0 (or enabled: false).
    canary:
      enabled: false
      version: v2
      image:
        tag: ""
      replicas: 1
      weight: 10

  orders:
    enabled: true
    component: api
    tier: backend
    replicas: 2
    image:
      repository: shoplite/orders
      tag: ""
    runAsUser: 65532
    instrumented: true
    probes:
      readinessPath: /readyz
      livenessPath: /healthz
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    ingressPath: /api/orders
    database:
      name: orders
      passwordKey: ORDERS_DB_PASSWORD
    env:
      # CATALOG_URL is derived from the release namespace by the chart.
      CATALOG_TIMEOUT_MS: "2000"
    allowFrom: []

  web:
    enabled: true
    component: frontend
    tier: frontend
    replicas: 2
    image:
      repository: shoplite/web
      tag: ""
    runAsUser: 101 # "nginx" in nginx-unprivileged
    # Static files only: its traffic is measured and traced one hop earlier, at Traefik.
    instrumented: false
    probes:
      readinessPath: /healthz
      livenessPath: /healthz
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
    ingressPath: /
    env: {}
    allowFrom: []
    # Rendered into config.json and mounted as a file (hot-reloaded by the kubelet).
    uiConfig:
      shopName: ShopLite
      currency: USD
      banner: ""

# Stateful tier: PostgreSQL StatefulSet with one PVC.
postgres:
  enabled: true
  image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  runAsUser: 70
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

database:
  # Secret holding POSTGRES_PASSWORD and one <SERVICE>_DB_PASSWORD per service. It is NOT part of
  # the chart: values never enter git (created by scripts/gitops-up.sh; ADR in docs/week8).
  existingSecret: db-credentials

networkPolicies:
  enabled: true
  # Namespace + pod label of the ingress controller allowed to reach the services.
  ingressController:
    namespace: ingress-traefik
    podName: traefik
