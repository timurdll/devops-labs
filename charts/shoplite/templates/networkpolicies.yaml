{{- if .Values.networkPolicies.enabled }}
{{- /*
Ingress isolation inside the release namespace:
  1. deny everything by default
  2. ingress controller → services exposed through the Ingress, on :8080
  3. services.<name>.allowFrom → <name> on :8080 (east-west)
  4. services with a database → postgres on :5432
  5. OpenTelemetry Collector → instrumented services on :8080 (GET /metrics), when telemetry is on
With mesh.enabled (Week 10) the ingress controller reaches only shop-gateway, the gateway reaches
the exposed services, and the Collector scrapes :15020 (istio-agent: app metrics merged with
Envoy's) on every pod. NetworkPolicy (L3/L4, by pod label) and AuthorizationPolicy (L7, by mTLS
identity) are two independent layers: either one alone blocks an unexpected caller.
*/ -}}
{{- $mesh := .Values.mesh.enabled }}
{{- $ic := .Values.networkPolicies.ingressController }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
{{- $exposed := list }}
{{- $dbClients := list }}
{{- $scraped := list }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- if $svc.ingressPath }}{{ $exposed = append $exposed $name }}{{ end }}
{{- if $svc.database }}{{ $dbClients = append $dbClients $name }}{{ end }}
{{- if $svc.instrumented }}{{ $scraped = append $scraped $name }}{{ end }}
{{- end }}
{{- end }}
{{- if and .Values.ingress.enabled $exposed }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-controller
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: {{ ternary (list "shop-gateway") $exposed $mesh | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ic.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $ic.podName }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
{{- if and $mesh $exposed }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: {{ $exposed | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shop-gateway
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.allowFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-{{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ $svc.allowFrom | toJson }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
{{- end }}
{{- if and .Values.postgres.enabled $dbClients }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-postgres
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ $dbClients | toJson }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if and .Values.telemetry.enabled $scraped }}
{{- $col := .Values.telemetry.collector }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-scrape
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  {{- if $mesh }}
  podSelector: {} # every pod has a sidecar, and every sidecar exports Envoy metrics
  {{- else }}
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: {{ $scraped | toJson }}
  {{- end }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $col.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $col.podName }}
      ports:
        # Without the mesh: the app's own /metrics. In the mesh, a plaintext scrape of :8080
        # would be rejected (STRICT mTLS), so the Collector reads istio-agent's merged endpoint.
        - port: {{ ternary 15020 8080 $mesh }}
          protocol: TCP
{{- end }}
{{- end }}
