{{- /*
One Deployment + ClusterIP Service per entry in .Values.services (catalog, orders, web).
Hardening is identical for every service and is not configurable on purpose: the Week 6 gates
(kubeconform -strict, trivy config) and Pod Security Admission "restricted" both depend on it.
*/ -}}
{{- $pd := .Values.podDefaults }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $env := include "shoplite.serviceEnv" (dict "name" $name "svc" $svc "ctx" $) | fromYaml }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: {{ $svc.component }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: {{ $pd.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: {{ $svc.component }}
        app.kubernetes.io/part-of: shoplite
        shoplite.io/environment: {{ $.Values.global.environment }}
        tier: {{ $svc.tier }}
      {{- if $env }}
      annotations:
        # Env vars are read once at start: a config change in git must roll the pods.
        checksum/config: {{ toYaml $env | sha256sum | trunc 16 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $pd.terminationGracePeriodSeconds }}
      enableServiceLinks: false # no legacy <SVC>_SERVICE_HOST/_PORT env vars; use DNS
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $svc.runAsUser }}
        runAsGroup: {{ $svc.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- /* Rendered for every replica count: if it depended on replicas > 1, scaling 1 → 2 would
             change the pod template and restart the pods (found in scenario A). */}}
      {{- if $pd.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ $pd.topologySpread.whenUnsatisfiable }}
          nodeTaintsPolicy: Honor
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "shoplite.image" (dict "svc" $svc "ctx" $) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if $env }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if and $svc.database $.Values.postgres.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.existingSecret }}
                  key: {{ $svc.database.passwordKey }}
            {{- end }}
          lifecycle:
            preStop:
              sleep: # native sleep action — distroless images have no /bin/sleep
                seconds: {{ $pd.preStopSleepSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probes.readinessPath }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ $svc.probes.livenessPath }}
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if eq $name "web" }}
          volumeMounts:
            - name: web-config # ConfigMap mounted as a file
              mountPath: /usr/share/nginx/html/config
              readOnly: true
            - name: tmp # nginx-unprivileged keeps pid + temp files in /tmp
              mountPath: /tmp
      volumes:
        - name: web-config
          configMap:
            name: web-config
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if and $.Values.podDisruptionBudget.enabled (gt (int $svc.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
