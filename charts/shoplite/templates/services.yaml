{{- /*
One Deployment of a service. Called once for the stable version and, when
services.<name>.canary.enabled, once more for the canary (Week 10). Both share the Service, the
ConfigMap and the ServiceAccount; they differ in name, replica count, image tag and `version`.
*/ -}}
{{- define "shoplite.deployment" -}}
{{- $name := .name }}{{ $svc := .svc }}{{ $deploy := .deploy }}{{ $version := .version }}
{{- $replicas := .replicas }}{{ $canary := .canary }}{{ $env := .env }}
{{- $root := .ctx }}{{ $pd := $root.Values.podDefaults }}{{ $mesh := $root.Values.mesh.enabled }}
{{- $tag := $svc.image.tag | default $root.Values.image.tag | default $root.Chart.AppVersion }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deploy }}
  labels:
    {{- include "shoplite.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: {{ $svc.component }}
    {{- if $mesh }}
    version: {{ $version }}
    {{- end }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: {{ $pd.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      {{- if $canary }}
      version: {{ $version }}
      {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: {{ $svc.component }}
        app.kubernetes.io/part-of: shoplite
        shoplite.io/environment: {{ $root.Values.global.environment }}
        tier: {{ $svc.tier }}
        {{- if $mesh }}
        # Week 10: Envoy sidecar (native sidecar container) injected by istiod; `version` selects
        # the DestinationRule subset and is reported as destination_version in Istio metrics.
        sidecar.istio.io/inject: "true"
        version: {{ $version }}
        {{- end }}
      {{- $scrape := and $root.Values.telemetry.enabled $svc.instrumented }}
      {{- if or $env $scrape }}
      annotations:
        {{- if $env }}
        # Env vars are read once at start: a config change in git must roll the pods.
        checksum/config: {{ toYaml $env | sha256sum | trunc 16 }}
        {{- end }}
        {{- if $scrape }}
        # Discovered by the Collector's prometheus receiver (kubernetes_sd, role: pod).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        {{- end }}
      {{- end }}
    spec:
      {{- if $mesh }}
      # One ServiceAccount per workload = one SPIFFE identity (spiffe://cluster.local/ns/<ns>/sa/<name>)
      # in the mTLS certificate; AuthorizationPolicies allow callers by this identity.
      serviceAccountName: {{ $name }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $pd.terminationGracePeriodSeconds }}
      enableServiceLinks: false # no legacy <SVC>_SERVICE_HOST/_PORT env vars; use DNS
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $svc.runAsUser }}
        runAsGroup: {{ $svc.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- /* Rendered for every replica count: if it depended on replicas > 1, scaling 1 → 2 would
             change the pod template and restart the pods (found in scenario A). */}}
      {{- if $pd.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ $pd.topologySpread.whenUnsatisfiable }}
          nodeTaintsPolicy: Honor
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "shoplite.image" (dict "svc" $svc "ctx" $root) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if $env }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if and $root.Values.telemetry.enabled $svc.instrumented }}
            # Per Deployment (not in the shared ConfigMap): the canary reports its own version.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "deployment.environment.name=%s,service.namespace=shoplite,service.version=%s" $root.Values.global.environment $tag | quote }}
            {{- end }}
            {{- if and $svc.database $root.Values.postgres.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.database.existingSecret }}
                  key: {{ $svc.database.passwordKey }}
            {{- end }}
          lifecycle:
            preStop:
              sleep: # native sleep action — distroless images have no /bin/sleep
                seconds: {{ $pd.preStopSleepSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probes.readinessPath }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ $svc.probes.livenessPath }}
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if eq $name "web" }}
          volumeMounts:
            - name: web-config # ConfigMap mounted as a file
              mountPath: /usr/share/nginx/html/config
              readOnly: true
            - name: tmp # nginx-unprivileged keeps pid + temp files in /tmp
              mountPath: /tmp
      volumes:
        - name: web-config
          configMap:
            name: web-config
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
          {{- end }}
{{- end }}
{{- /*
One Deployment + ClusterIP Service per entry in .Values.services (catalog, orders, web).
Hardening is identical for every service and is not configurable on purpose: the Week 6 gates
(kubeconform -strict, trivy config) and Pod Security Admission "restricted" both depend on it.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $env := include "shoplite.serviceEnv" (dict "name" $name "svc" $svc "ctx" $) | fromYaml }}
{{- $mesh := $.Values.mesh.enabled }}
{{- $stableVersion := $svc.version | default "v1" }}
{{ include "shoplite.deployment" (dict "name" $name "svc" $svc "deploy" $name "version" $stableVersion "replicas" $svc.replicas "canary" false "env" $env "ctx" $) }}
{{- if and $svc.canary $svc.canary.enabled }}
{{- $c := $svc.canary }}
{{- $csvc := deepCopy $svc }}{{ $_ := set $csvc.image "tag" $c.image.tag }}
{{ include "shoplite.deployment" (dict "name" $name "svc" $csvc "deploy" (printf "%s-%s" $name $c.version) "version" $c.version "replicas" $c.replicas "canary" true "env" $env "ctx" $) }}
{{- end }}
{{- if $mesh }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http # Istio: HTTP routing/metrics instead of protocol sniffing
{{- if and $.Values.podDisruptionBudget.enabled (gt (int $svc.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "shoplite.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
