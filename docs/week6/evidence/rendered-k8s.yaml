apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shoplite
  name: postgres
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: postgres
        tier: data
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/db/POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -h
            - 127.0.0.1
          initialDelaySeconds: 30
          periodSeconds: 10
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -h
            - 127.0.0.1
          periodSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /run/secrets/db
          name: db-credentials
          readOnly: true
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
          readOnly: true
        - mountPath: /var/run/postgresql
          name: run
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: db-credentials
        secret:
          defaultMode: 288
          secretName: db-credentials-d72dg62d64
      - configMap:
          defaultMode: 365
          name: postgres-init
        name: init-scripts
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: run
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: shop-ingress
    app.kubernetes.io/part-of: shoplite
  name: shop
  namespace: shop
spec:
  ingressClassName: traefik
  rules:
