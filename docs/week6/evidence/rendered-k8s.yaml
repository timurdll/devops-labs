    http:
      paths:
      - backend:
          service:
            name: catalog
            port:
              name: http
        path: /api/catalog
        pathType: Prefix
      - backend:
          service:
            name: orders
            port:
              name: http
        path: /api/orders
        pathType: Prefix
      - backend:
          service:
            name: web
            port:
              name: http
        path: /
        pathType: Prefix
