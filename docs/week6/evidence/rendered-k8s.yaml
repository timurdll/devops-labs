apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/name: traefik
  name: traefik
  namespace: ingress-traefik
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingress-controller
        app.kubernetes.io/name: traefik
    spec:
      containers:
      - args:
        - --entryPoints.web.address=:8000
        - --entryPoints.web.transport.lifeCycle.requestAcceptGraceTimeout=5s
        - --entryPoints.web.transport.lifeCycle.graceTimeOut=10s
        - --entryPoints.traefik.address=:9000
        - --ping=true
        - --ping.entryPoint=traefik
        - --providers.kubernetesingress=true
        - --providers.kubernetesingress.ingressclass=traefik
        - --providers.kubernetesingress.namespaces=shop
        - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
        - --accesslog=true
        - --log.level=INFO
        - --global.checknewversion=false
        - --global.sendanonymoususage=false
        image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /ping
            port: admin
          periodSeconds: 10
        name: traefik
        ports:
        - containerPort: 8000
          name: web
        - containerPort: 9000
          name: admin
        readinessProbe:
          httpGet:
            path: /ping
            port: admin
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        matchLabelKeys:
        - pod-template-hash
        maxSkew: 1
        nodeTaintsPolicy: Honor
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
