# Istio custom resources rendered by charts/shoplite for shop-staging (helm template, values from
# environments/staging/values.yaml). Do not edit — change the chart or the values and re-run
# scripts/mesh-export-manifests.sh. 15 resources: Gateway, VirtualService, DestinationRule, PeerAuthentication, AuthorizationPolicy, Telemetry
---
# Source: shoplite/templates/mesh.yaml
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  labels:
    helm.sh/chart: shoplite-0.3.0
    app.kubernetes.io/part-of: shoplite
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: shoplite
    app.kubernetes.io/version: "1.1.0"
    shoplite.io/environment: staging
spec:
  # Matches only gateway pods in this namespace (PILOT_SCOPE_GATEWAY_TO_NAMESPACE in istiod).
  selector:
    istio: shop-gateway
  servers:
    - port:
        # The Service port; Envoy listens on its targetPort 8080 (unprivileged). istioctl analyze
        # IST0162 flags a Gateway port that no Service of the gateway pods exposes.
        number: 80
        name: http
        protocol: HTTP
      # TLS terminates at Traefik, the cluster edge (Week 7); Traefik → gateway stays in-cluster.
      hosts:
        - "staging.shop.local"
---
# Source: shoplite/templates/mesh.yaml
# North-south routing: the path table of the Week 8 Ingress, now executed by Envoy. A service
# with a canary gets a weighted split right here, so browser traffic is shifted too.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: shop-edge
  labels:
    helm.sh/chart: shoplite-0.3.0
    app.kubernetes.io/part-of: shoplite
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: shoplite
    app.kubernetes.io/version: "1.1.0"
    shoplite.io/environment: staging
spec:
  hosts:
    - "staging.shop.local"
  gateways:
    - shop-gateway
  http:
    - name: orders
      match:
        - uri:
            prefix: /api/orders
      route:
        - destination:
            host: orders.shop-staging.svc.cluster.local
            port:
              number: 80
    - name: catalog
      match:
        - uri:
            prefix: /api/catalog
      route:
        - destination:
            host: catalog.shop-staging.svc.cluster.local
            subset: v1
            port:
              number: 80
          weight: 90
        - destination:
            host: catalog.shop-staging.svc.cluster.local
            subset: v2
            port:
              number: 80
          weight: 10
    - name: web
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: web.shop-staging.svc.cluster.local
            port:
              number: 80
---
# Source: shoplite/templates/mesh.yaml
# East-west canary: every sidecar that calls catalog (e.g. orders → catalog) applies the same
# split, so the canary sees the same share of internal and external traffic.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog
  labels:
    helm.sh/chart: shoplite-0.3.0
    app.kubernetes.io/part-of: shoplite
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: shoplite
    app.kubernetes.io/version: "1.1.0"
    shoplite.io/environment: staging
spec:
  hosts:
    - catalog.shop-staging.svc.cluster.local
  gateways:
    - mesh
  http:
    - name: catalog-canary
      route:
        - destination:
            host: catalog.shop-staging.svc.cluster.local
            subset: v1
            port:
              number: 80
          weight: 90
        - destination:
            host: catalog.shop-staging.svc.cluster.local
            subset: v2
            port:
              number: 80
          weight: 10
---
# Source: shoplite/templates/mesh.yaml
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog
  labels:
    helm.sh/chart: shoplite-0.3.0
    app.kubernetes.io/part-of: shoplite
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: shoplite
    app.kubernetes.io/version: "1.1.0"
    shoplite.io/environment: staging
spec:
  host: catalog.shop-staging.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # originate mTLS with the workload certificate (explicit; auto-mTLS would too)
    connectionPool:
      tcp:
        # Week 9 finding: a fetch to a missing catalog hung in TCP connect for 10 s. Envoy fails the
        # connect after this timeout instead and answers 503 (no healthy upstream).
        connectTimeout: 1s
    outlierDetection:
      # Passive health checking: eject an endpoint that keeps failing, so one bad pod (e.g. a broken
      # canary replica) stops receiving traffic until it recovers.
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
