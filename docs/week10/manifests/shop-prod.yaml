# Source: shoplite/templates/mesh.yaml
# Transport security of every sidecar in this namespace. Overrides the mesh-wide STRICT default
# only while mesh.mtlsMode is PERMISSIVE (migration window, ADR-W10-04).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  labels:
    helm.sh/chart: shoplite-0.3.0
    app.kubernetes.io/part-of: shoplite
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: shoplite
    app.kubernetes.io/version: "1.1.0"
    shoplite.io/environment: prod
spec:
  mtls:
    mode: PERMISSIVE
---
# Source: shoplite/templates/mesh.yaml
# Gateway access log (Envoy → stdout): one line per request with the upstream cluster, e.g.
# outbound|80|v2|catalog.shop-prod.svc.cluster.local — the subset that served the request.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: gateway-access-log
  labels:
    helm.sh/chart: shoplite-0.3.0
    app.kubernetes.io/part-of: shoplite
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: shoplite
    app.kubernetes.io/version: "1.1.0"
    shoplite.io/environment: prod
spec:
  selector:
    matchLabels:
      istio: shop-gateway
  accessLogging:
    - providers:
        - name: envoy
