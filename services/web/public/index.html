<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1 id="shop-name">ShopLite</h1>
    <p id="banner" class="banner" hidden></p>
  </header>
  <main>
    <section>
      <h2>Catalog <small id="catalog-pod"></small></h2>
      <table id="products">
        <thead><tr><th>SKU</th><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Recent orders <small id="orders-pod"></small></h2>
      <p id="status" role="status"></p>
      <table id="orders">
        <thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Total</th><th>Created</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <footer>Served by web pod <code id="web-env"></code></footer>
  <script src="/app.js"></script>
</body>
</html>
