# Layer 2 · dev — fast feedback, smallest footprint. Auto-synced by Argo CD (prune + self-heal).
# Only what differs from charts/shoplite/values.yaml belongs here.
ingress:
  host: dev.shop.local

# Week 9: traces → OpenTelemetry Collector, /metrics scraped (every request is traced).
telemetry:
  enabled: true
  samplingRatio: 1.0

# Week 10 · phase 1 — into the mesh: sidecars + gateway, mTLS PERMISSIVE (plaintext still accepted)
# until every workload of the namespace has a sidecar; then phase 2 switches to STRICT + authz.
mesh:
  enabled: true
  mtlsMode: PERMISSIVE
  authorization: false

services:
  catalog:
    replicas: 2
    resources:
      requests: { cpu: 25m, memory: 48Mi }
  orders:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 48Mi }
    env:
      CATALOG_TIMEOUT_MS: "5000" # generous: dev pods are often cold
  web:
    replicas: 2
    uiConfig:
      shopName: ShopLite DEV
      banner: "dev: service mesh (Week 10)"
