# Layer 2 · dev — fast feedback, smallest footprint. Auto-synced by Argo CD (prune + self-heal).
# Only what differs from charts/shoplite/values.yaml belongs here.
ingress:
  host: dev.shop.local

# Week 9: traces → OpenTelemetry Collector, /metrics scraped (every request is traced).
telemetry:
  enabled: true
  samplingRatio: 1.0

# Week 10 · phase 2 — zero trust: every workload has a sidecar (phase 1 verified with
# istioctl proxy-status), so plaintext is no longer accepted (STRICT) and every call must come
# from an allowed SPIFFE identity (AuthorizationPolicy default deny + call-graph ALLOWs).
mesh:
  enabled: true
  mtlsMode: STRICT
  authorization: true

services:
  catalog:
    replicas: 2
    resources:
      requests: { cpu: 25m, memory: 48Mi }
  orders:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 48Mi }
    env:
      CATALOG_TIMEOUT_MS: "5000" # generous: dev pods are often cold
  web:
    replicas: 2
    uiConfig:
      shopName: ShopLite DEV
      banner: "dev: service mesh (Week 10)"
