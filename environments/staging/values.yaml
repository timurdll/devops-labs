# Layer 2 · staging — production shape (2 replicas spread over nodes, PDBs), smaller sizing.
# Auto-synced by Argo CD (prune + self-heal). A change is promoted here after it worked in dev.
ingress:
  host: staging.shop.local

podDisruptionBudget:
  enabled: true

# Week 9: traces → OpenTelemetry Collector, /metrics scraped (every request is traced).
telemetry:
  enabled: true
  samplingRatio: 1.0

# Week 10 · phase 2 — zero trust: every workload has a sidecar (phase 1 verified with
# istioctl proxy-status), so plaintext is no longer accepted (STRICT) and every call must come
# from an allowed SPIFFE identity (AuthorizationPolicy default deny + call-graph ALLOWs).
mesh:
  enabled: true
  mtlsMode: STRICT
  authorization: true
  # Week 11: edge rate limit (429 above 100 req/s sustained, bursts up to 200 per gateway pod).
  gateway:
    rateLimit:
      enabled: true
      requestsPerSecond: 100
      burst: 200

services:
  # Week 10 · phase 3 promoted the 1.2.0 canary (product search). Week 12: catalog is an Argo
  # Rollout — a new tag goes 10 → 25 → 50 → 100 % with a Prometheus analysis at every step and is
  # rolled back automatically when the canary's 5xx share or p95 breaks the limits (chart values).
  catalog:
    image:
      tag: "1.3.0"
    canary:
      enabled: false
    rollout:
      enabled: true
  # Week 11: orders 1.2.0 — circuit breaker + retry + cache fallback for the catalog call;
  # 1.2.1 — retry of the PostgreSQL connect; 1.2.2 — HTTP keep-alive longer than Envoy's
  # (post-mortem PM-W11-02).
  orders:
    image:
      tag: "1.2.2"
  web:
    uiConfig:
      shopName: ShopLite STAGING
      banner: "staging: release candidate"
