# Layer 2 · staging — production shape (2 replicas spread over nodes, PDBs), smaller sizing.
# Auto-synced by Argo CD (prune + self-heal). A change is promoted here after it worked in dev.
ingress:
  host: staging.shop.local

podDisruptionBudget:
  enabled: true

# Week 9: traces → OpenTelemetry Collector, /metrics scraped (every request is traced).
telemetry:
  enabled: true
  samplingRatio: 1.0

# Week 10 · phase 2 — zero trust: every workload has a sidecar (phase 1 verified with
# istioctl proxy-status), so plaintext is no longer accepted (STRICT) and every call must come
# from an allowed SPIFFE identity (AuthorizationPolicy default deny + call-graph ALLOWs).
mesh:
  enabled: true
  mtlsMode: STRICT
  authorization: true

services:
  # Week 10 · phase 3 — canary release of catalog 1.2.0 (product search). 10 % of all requests to
  # catalog — from the gateway and from orders — go to the v2 Deployment, independent of how many
  # replicas each version runs. Promote by raising weight in git; roll back with weight: 0.
  catalog:
    canary:
      enabled: true
      version: v2
      image:
        tag: "1.2.0"
      replicas: 1
      weight: 10
  web:
    uiConfig:
      shopName: ShopLite STAGING
      banner: "staging: release candidate"
