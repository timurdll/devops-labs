# Layer 2 · staging — production shape (2 replicas spread over nodes, PDBs), smaller sizing.
# Auto-synced by Argo CD (prune + self-heal). A change is promoted here after it worked in dev.
ingress:
  host: staging.shop.local

podDisruptionBudget:
  enabled: true

# Week 9: traces → OpenTelemetry Collector, /metrics scraped (every request is traced).
telemetry:
  enabled: true
  samplingRatio: 1.0

# Week 10 · phase 1 — into the mesh: sidecars + gateway, mTLS PERMISSIVE (plaintext still accepted)
# until every workload of the namespace has a sidecar; then phase 2 switches to STRICT + authz.
mesh:
  enabled: true
  mtlsMode: PERMISSIVE
  authorization: false

services:
  web:
    uiConfig:
      shopName: ShopLite STAGING
      banner: "staging: release candidate"
