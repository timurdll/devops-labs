# Layer 2 · prod — highest availability. Argo CD detects the difference between git and the cluster
# (OutOfSync) but does NOT sync on its own: an operator approves every sync (manual gate).
ingress:
  host: prod.shop.local

podDisruptionBudget:
  enabled: true

# Week 9: traces → OpenTelemetry Collector, /metrics scraped. samplingRatio only applies to traces
# that START in a service; requests through Traefik inherit Traefik's decision (parent-based).
telemetry:
  enabled: true
  samplingRatio: 1.0

# Week 10 · phase 1 — into the mesh: sidecars + gateway, mTLS PERMISSIVE (plaintext still accepted)
# until every workload of the namespace has a sidecar; then phase 2 switches to STRICT + authz.
mesh:
  enabled: true
  mtlsMode: PERMISSIVE
  authorization: false
  gateway:
    replicas: 2 # the gateway is now on the request path: same availability as the APIs

services:
  catalog:
    replicas: 3
    resources:
      requests: { cpu: 100m, memory: 96Mi }
      limits: { cpu: "1", memory: 384Mi }
  orders:
    replicas: 3
    resources:
      requests: { cpu: 100m, memory: 96Mi }
      limits: { cpu: "1", memory: 384Mi }
  web:
    uiConfig:
      shopName: ShopLite
      banner: "Release 2026.11 approved for production"

postgres:
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 250m, memory: 384Mi }
