# kind cluster for Week 7: 1 control-plane + 2 workers.
# Host 127.0.0.1:8080 → control-plane node :30080 (Traefik NodePort) → kube-proxy → Traefik pod :8000
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shoplite
# Let containerd read per-registry hosts.toml files; scripts/k8s-up.sh points docker.io at
# mirror.gcr.io (avoids Docker Hub's anonymous pull limit — every image is digest-pinned, so a
# mirror cannot substitute content).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      shoplite.io/pool: apps
  - role: worker
    labels:
      shoplite.io/pool: apps
