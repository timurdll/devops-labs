# ShopLite CI — Week 6 (Lab 2): CI/CD architecture with DevSecOps quality gates.
#
#   G1 secret-scan ─┐
#   G2 lint ────────┤
#   G2 lint-infra ──┤
#   G3 test ────────┼──► G6 image (build → Trivy gate → SBOM) ──► G8 publish (push + cosign sign)
#   G4 sast ────────┤                                              only on push to main / v* tags
#   G5 deps-audit ──┤
#   G7 iac-scan ────┘
#
# Supply-chain hardening applied to this file itself (see docs/week6/README.md, STRIDE T-01/T-04):
#   * every third-party action is pinned to a full commit SHA (tags are mutable — cf. trivy-action, March 2026)
#   * every container tool is pinned to tag + digest
#   * default GITHUB_TOKEN permissions are empty; each job asks only for what it needs
#   * checkout never persists credentials; no pull_request_target trigger

name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  TRIVY_VERSION: v0.75.0
  # Fail threshold for the image gate. Unfixed CVEs are reported but do not block (nothing to upgrade to).
  TRIVY_GATE_SEVERITY: HIGH,CRITICAL
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  # ── G1 · Secret scanning ─────────────────────────────────────────────────────
  # Pass: 0 leaks in the full git history.  Fail: any finding (exit 1).
  secret-scan:
    name: G1 · secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --redact --verbose --exit-code 1 --log-opts="--all"

  # ── G2 · Lint (code) ─────────────────────────────────────────────────────────
  # Pass: 0 ESLint errors.  Fail: any error.
  lint:
    name: G2 · lint (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  # ── G2 · Lint (infrastructure) ───────────────────────────────────────────────
  # Pass: Dockerfiles have no hadolint warnings, every K8s object validates against
  # the Kubernetes 1.37 schema, and this workflow passes actionlint.  Fail: any finding.
  lint-infra:
    name: G2 · lint (Dockerfile, K8s, workflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          for f in services/*/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < "$f"
            echo "::endgroup::"
          done
      - name: kubeconform (strict schema validation)
        run: |
          cp k8s/shop/secrets/db.env.example k8s/shop/secrets/db.env   # placeholder values for rendering only
          kubectl kustomize k8s/ > /tmp/rendered.yaml
          docker run --rm -v /tmp:/work "$KUBECONFORM_IMAGE" \
            -strict -summary -kubernetes-version 1.37.0 /work/rendered.yaml
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  # ── G3 · Unit tests + coverage ───────────────────────────────────────────────
  # Pass: all tests green AND line coverage ≥ 80 %, branch coverage ≥ 70 % (enforced by node --test).
  test:
    name: G3 · test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  # ── G4 · SAST ────────────────────────────────────────────────────────────────
  # Pass: 0 Semgrep findings at ERROR/WARNING severity.  Fail: any blocking finding (--error).
  sast:
    name: G4 · SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/javascript --config p/nodejs --config p/secrets \
            --config p/dockerfile --config p/kubernetes --config p/github-actions --config .semgrep/ \
            --severity ERROR --severity WARNING \
            --metrics off --error --sarif-output semgrep.sarif --text
      - name: Upload SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── G5 · Dependency audit (SCA) ──────────────────────────────────────────────
  # Pass: no known HIGH/CRITICAL advisory in production dependencies.  Fail: npm audit exit ≠ 0.
  deps-audit:
    name: G5 · deps (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify lockfile integrity & registry signatures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
      - run: npm audit --omit=dev --audit-level=high

  # ── G7 · IaC misconfiguration scan ───────────────────────────────────────────
  # Pass: 0 HIGH/CRITICAL misconfigurations in Dockerfiles and K8s manifests.  Fail: exit 1.
  iac-scan:
    name: G7 · IaC scan (trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml # scoped, justified, expiring risk acceptances only
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          skip-dirs: docs
          severity: ${{ env.TRIVY_GATE_SEVERITY }}
          exit-code: '1'
          format: table

  # ── G6 · Build + image scan, then G8 · publish ───────────────────────────────
  # The image that is pushed is byte-for-byte the image that was scanned (no rebuild between scan and push).
  image:
    name: G6/G8 · image (${{ matrix.service }})
    needs: [secret-scan, lint, lint-infra, test, sast, deps-audit, iac-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io (only used on main / tags)
      id-token: write # keyless cosign signing via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, web]
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/shoplite-${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load into local daemon, do not push yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: G6 · Trivy image gate (fail on fixable HIGH/CRITICAL, any embedded secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln,secret
          severity: ${{ env.TRIVY_GATE_SEVERITY }}
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-${{ matrix.service }}.txt

      - name: Trivy full report (all severities, JSON)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: json
          output: trivy-${{ matrix.service }}.json

      - name: CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json

      - name: Publish gate result to the job summary
        if: always()
        run: |
          {
            echo "### Trivy gate — ${{ matrix.service }}"
            echo '```'
            cat trivy-${{ matrix.service }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-${{ matrix.service }}.txt

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.txt
            trivy-${{ matrix.service }}.json
            sbom-${{ matrix.service }}.cdx.json
          retention-days: 30

      # ── G8 · Publish: only for trusted refs, never for pull requests ──────────
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        id: push
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          first=$(echo "$TAGS" | head -n1)
          echo "ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$first")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign image and attach SBOM attestation (keyless, Sigstore)
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-${{ matrix.service }}.cdx.json "$REF"
          echo "Signed $REF" >> "$GITHUB_STEP_SUMMARY"
