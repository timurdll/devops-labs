apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop

resources:
  - namespace.yaml
  - configmaps.yaml
  - postgres.yaml
  - catalog.yaml
  - orders.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicies.yaml

# The Secret is declared here but its values live in secrets/db.env, which is git-ignored
# (see secrets/db.env.example). Kustomize appends a content hash to the name, so rotating a
# password produces a new Secret name and triggers a rolling update of every consumer.
secretGenerator:
  - name: db-credentials
    type: Opaque
    envs:
      - secrets/db.env

labels:
  - pairs:
      app.kubernetes.io/part-of: shoplite
    includeSelectors: false
