# Non-sensitive configuration only. Anything secret goes to the `db-credentials` Secret.
#
# Injection patterns used in this lab:
#   catalog-config / orders-config  → envFrom (environment variables, read once at start)
#   web-config                      → volume  (file /usr/share/nginx/html/config/config.json, hot-updated by kubelet)
#   postgres-init                   → volume  (init script executed by the postgres entrypoint on first boot)
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  labels:
    app.kubernetes.io/name: catalog
data:
  PGHOST: postgres.shop.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: catalog
  PGUSER: catalog
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  labels:
    app.kubernetes.io/name: orders
data:
  PGHOST: postgres.shop.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: orders
  PGUSER: orders
  CATALOG_URL: http://catalog.shop.svc.cluster.local
  CATALOG_TIMEOUT_MS: "2000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    app.kubernetes.io/name: web
data:
  config.json: |
    {
      "shopName": "ShopLite (kind)",
      "currency": "USD",
      "banner": "Week 7 lab: served through Traefik Ingress -> ClusterIP Services -> Pods",
      "environment": "dev / kind-shoplite"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
data:
  10-service-databases.sh: |
    #!/bin/sh
    # Database-per-service: each microservice gets its own database and login role.
    # Passwords are read from the Secret mounted at /run/secrets/db (never from env or args).
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v catalog_pw="$(cat /run/secrets/db/CATALOG_DB_PASSWORD)" \
      -v orders_pw="$(cat /run/secrets/db/ORDERS_DB_PASSWORD)" <<'EOSQL'
    CREATE ROLE catalog LOGIN PASSWORD :'catalog_pw';
    CREATE DATABASE catalog OWNER catalog;
    REVOKE ALL ON DATABASE catalog FROM PUBLIC;
    CREATE ROLE orders LOGIN PASSWORD :'orders_pw';
    CREATE DATABASE orders OWNER orders;
    REVOKE ALL ON DATABASE orders FROM PUBLIC;
    EOSQL
