# North-south entry point. Traefik matches Host + longest path prefix:
#   shop.local/api/catalog/*  → Service catalog:80 → pod :8080
#   shop.local/api/orders/*   → Service orders:80  → pod :8080
#   shop.local/*              → Service web:80     → pod :8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  labels:
    app.kubernetes.io/name: shop-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: shop.local
      http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  name: http
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
