# Jaeger v2 all-in-one (receiver + in-memory storage + query UI/API on :16686).
# Pinned to 2.20.x on purpose: 2.21 removed the legacy /api/services and /api/traces search routes,
# and Grafana 13.2's Jaeger data source still uses them (health check, pickers, search → 404).
# Found during the Week 9 rollout; tracked upstream in grafana/grafana-jaeger-datasource#87.
# Move back to the latest 2.x once that plugin speaks /api/v3 (ADR-W9-05).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: trace-store
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate # in-memory store: a second pod would see a different set of traces
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: trace-store
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
          imagePullPolicy: IfNotPresent
          args: ["--config=file:/conf/config.yaml"]
          env:
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: query-http, containerPort: 16686 }
            - { name: query-grpc, containerPort: 16685 }
            - { name: metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc }
    - { name: query-http, port: 16686, targetPort: query-http }
